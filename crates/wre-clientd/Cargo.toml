[package]
name = "wre-clientd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "wred, the host process that runs compiled headless clients and speaks the sidecar protocol"

[[bin]]
name = "wred"
path = "src/main.rs"

[features]
default = ["target-example", "target-altcha", "target-akamai"]
target-example = ["dep:wre-client-example"]
target-altcha = ["dep:wre-client-altcha"]
target-akamai = ["dep:wre-client-akamai"]

[dependencies]
wre-client.workspace = true
wre-core.workspace = true
wre-client-example = { workspace = true, optional = true }
wre-client-altcha = { workspace = true, optional = true }
wre-client-akamai = { workspace = true, optional = true }

anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
