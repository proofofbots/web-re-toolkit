[bundle.default]
targets = ["example", "altcha", "akamai", "kasada"]
platforms = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]

[package]
version = "3.1.1"
node_scope = "@proofofbot"
python_prefix = "wre-"
go_module = "github.com/proofofbots/web-re-toolkit/packages/go/clients"
rust_prefix = "wre-sdk-"
license = "MIT"
repository = "https://github.com/proofofbots/web-re-toolkit"
download_url = "https://github.com/proofofbots/web-re-toolkit/releases/download/v{version}/wred-{triple}"
node_runtime = "^3.1.1"
python_runtime = ">=3.1.1"
go_runtime = "github.com/proofofbots/web-re-toolkit/packages/go/wre v0.1.0"
