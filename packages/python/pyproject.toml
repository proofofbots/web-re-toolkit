[project]
name = "wre-runtime"
version = "0.2.1"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
packages = ["wre_runtime"]

[tool.setuptools.package-data]
wre_runtime = ["py.typed"]
