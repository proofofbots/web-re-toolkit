[workspace]
resolver = "2"
members = ["crates/*", "clients/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/proofofbots/web-re-toolkit"

[workspace.dependencies]
wre-core = { path = "crates/wre-core", version = "0.1.0" }
wre-net = { path = "crates/wre-net", version = "0.1.0" }
wre-cdp = { path = "crates/wre-cdp", version = "0.1.0" }
wre-probe = { path = "crates/wre-probe", version = "0.1.0" }
wre-capture = { path = "crates/wre-capture", version = "0.1.0" }
wre-js = { path = "crates/wre-js", version = "0.1.0" }
wre-live = { path = "crates/wre-live", version = "0.1.0" }
wre-env = { path = "crates/wre-env", version = "0.1.0" }
wre-vm = { path = "crates/wre-vm", version = "0.1.0" }
wre-wire = { path = "crates/wre-wire", version = "0.1.0" }
wre-variants = { path = "crates/wre-variants", version = "0.1.0" }
wre-report = { path = "crates/wre-report", version = "0.1.0" }
wre-target = { path = "crates/wre-target", version = "0.1.0" }
wre-client = { path = "crates/wre-client", version = "0.1.0" }
wre-client-altcha = { path = "clients/altcha", version = "0.1.0" }
wre-codegen = { path = "crates/wre-codegen", version = "0.1.0" }
wre-client-example = { path = "clients/example", version = "0.1.0" }

aes-gcm = "0.11.0"
anyhow = "1.0.104"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
base64 = "0.23.1"
bitflags = "2.13.1"
byteorder = "1.5.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
crc32fast = "1.5.0"
flate2 = "1.1.9"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
indexmap = { version = "2.14.0", features = ["serde"] }
md-5 = "0.11.0"
pbkdf2 = "0.13.0"
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.4"
rand = "0.10.2"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "json", "gzip", "brotli", "deflate", "socks", "stream", "charset"] }
rustls = "0.23.43"
scrypt = { version = "0.12.0", default-features = false, features = ["kdf"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
similar = "3.1.2"
thiserror = "2.0.20"
toml = "1.1.4"
tokio = { version = "1.53.1", features = ["full"] }
tokio-socks = "0.5.3"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
twox-hash = "2.1.3"
url = "2.5.8"
walkdir = "2.5.0"

oxc_allocator = "0.143.0"
oxc_ast = "0.143.0"
oxc_ast_visit = "0.143.0"
oxc_codegen = "0.143.0"
oxc_ecmascript = "0.143.0"
oxc_parser = "0.143.0"
oxc_semantic = "0.143.0"
oxc_span = "0.143.0"
oxc_syntax = "0.143.0"

v8 = "152.1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1
